[package]
name = "pixo-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "One-shot Pixoo-Max Bluetooth artwork and scene controller"
license = "MIT"

[[bin]]
name = "pixo"
path = "src/main.rs"

[dependencies]
divoom-bluetooth = { path = "../.." }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fs2 = "0.4"
ctrlc = "3.4"
font8x8 = "0.3"
image = { version = "0.25.9", default-features = false, features = ["gif", "png", "jpeg", "bmp", "webp"] }
gif = "0.13"
